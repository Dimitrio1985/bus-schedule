name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/dmytryku/busschedule app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BusSchedule"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dmytryku.busschedule'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.dmytryku.busschedule'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:usesCleartextTraffic="true"
                  android:label="Автобусы"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dmytryku/busschedule/MainActivity.java <<'EOF'
          package com.dmytryku.busschedule;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
          s.setUseWideViewPort(true);
          s.setLoadWithOverviewMode(true);
          s.setTextZoom(100);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String sch = u.getScheme();
                          if ("http".equals(sch) || "https".equals(sch) || "file".equals(sch)) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Расписание автобусов</title>
          <style>
          :root{--bg:#f5f6f8;--card:#fff;--text:#1b1f24;--muted:#6b7280;--accent:#1a73e8;--danger:#d93025;--line:#e3e5e8}
          @media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1c2026;--text:#eceef1;--muted:#98a0ab;--accent:#7ab0ff;--danger:#ff8a80;--line:#2b3037}}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif}
          main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
          h1{font-size:22px;margin:24px 0 16px}
          .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
          input{width:100%;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px}
          button{font:inherit;border:0;border-radius:10px;padding:12px 16px}
          .primary{background:var(--accent);color:#fff;font-weight:600}
          .secondary{background:transparent;color:var(--muted)}
          .stop{display:flex;align-items:center;gap:8px}
          .stop a{flex:1;color:var(--text);text-decoration:none;font-weight:600;font-size:17px;padding:8px 0;word-break:break-word;min-width:0}
          .stop small{display:block;color:var(--muted);font-weight:400;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .ic{background:transparent;color:var(--muted);padding:8px 10px;font-size:18px}
          .del{color:var(--danger)}
          .empty{text-align:center;color:var(--muted);padding:24px 0}
          .fab{position:fixed;right:20px;bottom:24px;width:60px;height:60px;border-radius:50%;padding:0;background:var(--accent);color:#fff;font-size:34px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.35)}
          .ov{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px;z-index:10}
          .ov.open{display:flex}
          .dlg{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:420px}
          .dlg h2{margin:0 0 14px;font-size:19px}
          .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
          </style>
          </head>
          <body>
          <main>
            <h1>🚌 Расписание автобусов</h1>
            <div id="list"></div>
          </main>
          <button class="fab" id="add" aria-label="Добавить остановку">+</button>
          <div class="ov" id="ov">
            <div class="dlg">
              <h2 id="ttl">Новая остановка</h2>
              <input id="name" placeholder="Название остановки" autocomplete="off">
              <input id="url" type="url" placeholder="Вставьте ссылку на расписание" autocomplete="off">
              <div class="row">
                <button class="secondary" id="cancel">Отмена</button>
                <button class="primary" id="save">Сохранить</button>
              </div>
            </div>
          </div>
          <script>
          var KEY="bus-stops",stops=[],editing=-1,isOpen=false;
          function load(){try{stops=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){stops=[]}}
          function store(){try{localStorage.setItem(KEY,JSON.stringify(stops))}catch(e){}}
          function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
          function render(){
            var l=document.getElementById("list");
            if(!stops.length){l.innerHTML='<div class="empty">Пока нет остановок.<br>Нажмите «+», чтобы добавить.</div>';return}
            l.innerHTML=stops.map(function(s,i){
              return '<div class="card stop"><a href="'+esc(s.url)+'" target="_blank">'+esc(s.name)+'<small>'+esc(s.url)+'</small></a>'+
              '<button class="ic" onclick="openDlg('+i+')">✏️</button>'+
              '<button class="ic del" onclick="del('+i+')">🗑</button></div>'
            }).join("")
          }
          function fixUrl(u){u=u.trim();if(u&&!/^https?:\/\//i.test(u))u="https://"+u;return u}
          function openDlg(i){
            editing=(typeof i==="number")?i:-1;
            document.getElementById("ttl").textContent=editing>=0?"Изменить остановку":"Новая остановка";
            document.getElementById("name").value=editing>=0?stops[editing].name:"";
            document.getElementById("url").value=editing>=0?stops[editing].url:"";
            document.getElementById("ov").className="ov open";
            if(!isOpen){isOpen=true;try{history.pushState({d:1},"")}catch(e){}}
            setTimeout(function(){document.getElementById("name").focus()},50)
          }
          function hideDlg(){isOpen=false;document.getElementById("ov").className="ov"}
          function closeDlg(){if(isOpen){try{history.back()}catch(e){hideDlg()}}}
          window.addEventListener("popstate",hideDlg);
          document.getElementById("add").onclick=function(){openDlg()};
          document.getElementById("cancel").onclick=closeDlg;
          document.getElementById("ov").onclick=function(e){if(e.target===this)closeDlg()};
          document.getElementById("save").onclick=function(){
            var n=document.getElementById("name").value.trim(),u=fixUrl(document.getElementById("url").value);
            if(!n||!u)return;
            if(editing>=0){stops[editing]={name:n,url:u}}else stops.push({name:n,url:u});
            store();render();closeDlg()
          };
          function del(i){if(confirm("Удалить «"+stops[i].name+"»?")){stops.splice(i,1);store();render()}}
          load();render();
          </script>
          </body>
          </html>
          EOF

          if [ -f icon.png ]; then
            mkdir -p app/src/main/res/mipmap-xxhdpi
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            sed -i 's|<application|<application android:icon="@mipmap/ic_launcher"|' app/src/main/AndroidManifest.xml
          fi
      - name: Build APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bus-schedule.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bus-schedule-apk
          path: bus-schedule.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Автобусы v${{ github.run_number }}
          files: bus-schedule.apk
          
