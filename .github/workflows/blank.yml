                backupNote:"Восстановление заменит текущий список. При необходимости сначала сделай копию."
              },
              uk: {
                title:"Розклад Лодзь", intro:"Твої зупинки завжди під рукою.",
                search:"Пошук зупинки або номера…", all:"Усі зупинки", favOnly:"★ Обране",
                add:"＋ Додати зупинку", empty:"Поки немає зупинок", emptyText:"Додай зупинку, щоб швидко відкривати офіційний розклад.",
                addFirst:"Додати першу зупинку", edit:"Змінити зупинку", newStop:"Нова зупинка",
                name:"Назва зупинки", url:"Номер зупинки або посилання", urlHint:"Введи номер або встав посилання з rozklady.lodz.pl.",
                fav:"Додати до обраного", cancel:"Скасувати", save:"Зберегти зупинку", update:"Зберегти зміни",
                invalidName:"Введи назву зупинки.", invalidUrl:"Введи номер або коректне посилання з rozklady.lodz.pl.",
                duplicate:"Цей розклад уже збережено.", saved:"Зупинку збережено.", updated:"Зупинку оновлено.",
                deleted:"Зупинку видалено.", confirmDelete:"Видалити цю зупинку?", open:"Відкрити розклад",
                favourite:"Змінити обране", backup:"Резервна копія / відновлення", backupHint:"Скопіюй JSON і збережи в нотатках. Для відновлення встав раніше збережену копію.",
                copy:"Виділити текст", close:"Закрити", import:"Відновити", copied:"Текст виділено. Скопіюй його через меню телефону.",
                restored:"Резервну копію відновлено.", badBackup:"Некоректна копія. Дані не змінено.",
                noFav:"В обраному поки немає зупинок.", lang:"Мова", theme:"Змінити тему",
                namePlaceholder:"Наприклад, Piotrkowska Centrum", urlPlaceholder:"Наприклад, 209 або посилання",
                delete:"Видалити", editAction:"Змінити", count:n=>`Зупинок: ${n}`,
                backupNote:"Відновлення замінить поточний список. За потреби спочатку створи копію."
              }
            };

            let lang = "pl";
            let theme = "light";
            let stops = [];
            let editingId = null;
            let favouritesOnly = false;
            let toastTimer;

            function load(key) {
              try { return localStorage.getItem(key); } catch (_) { return null; }
            }
            function persist() {
              try {
                localStorage.setItem(STORAGE, JSON.stringify(stops));
                return true;
              } catch (_) {
                notify("Storage unavailable");
                return false;
              }
            }
            function tr(key, ...args) {
              const val = dict[lang][key] ?? dict.en[key] ?? key;
              return typeof val === "function" ? val(...args) : val;
            }
            function notify(message) {
              const el = $("toast");
              el.textContent = message;
              el.classList.remove("hidden");
              clearTimeout(toastTimer);
              toastTimer = setTimeout(() => el.classList.add("hidden"), 2600);
            }
            function safeUrl(value) {
              const raw = String(value || "").trim();
              if (/^\d+$/.test(raw)) {
                return "http://rozklady.lodz.pl/Home/TimeTableReal?busStopNum=" + raw;
              }
              try {
                const u = new URL(raw);
                if (!["http:", "https:"].includes(u.protocol)) return null;
                if (u.hostname.toLowerCase() !== "rozklady.lodz.pl") return null;
                if (u.username || u.password) return null;
                if (!u.pathname.startsWith("/Home/TimeTableReal")) return null;
                const num = u.searchParams.get("busStopNum");
                if (!num || !/^\d+$/.test(num)) return null;
                return u.href;
              } catch (_) { return null; }
            }
            function stopNumber(url) {
              try { return new URL(url).searchParams.get("busStopNum") || ""; }
              catch (_) { return ""; }
            }
            function uid() {
              return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
            }

            function render() {
              $("title").textContent = tr("title");
              $("intro").textContent = tr("intro");
              $("search").placeholder = tr("search");
              $("allTab").textContent = tr("all");
              $("favTab").textContent = tr("favOnly");
              $("addBtn").textContent = tr("add");
              $("addBtn").setAttribute("aria-label", tr("add"));
              $("langBtn").textContent = lang.toUpperCase();
              $("langBtn").setAttribute("aria-label", tr("lang"));
              $("themeBtn").textContent = theme === "dark" ? "☀" : "☾";
              $("themeBtn").setAttribute("aria-label", tr("theme"));
              $("backupBtn").setAttribute("aria-label", tr("backup"));
              $("allTab").className = favouritesOnly ? "secondary" : "primary";
              $("favTab").className = favouritesOnly ? "primary" : "secondary";

              const q = $("search").value.trim().toLocaleLowerCase();
              const filtered = stops.filter(s =>
                (!favouritesOnly || s.fav) &&
                (s.name.toLocaleLowerCase().includes(q) ||
                 stopNumber(s.url).includes(q))
              );
              const list = $("list");
              list.replaceChildren();

              if (!filtered.length) {
                const empty = document.createElement("div");
                empty.className = "card empty";
                const icon = document.createElement("div");
                icon.className = "emoji";
                icon.textContent = favouritesOnly ? "☆" : "🚏";
                const title = document.createElement("strong");
                title.textContent = favouritesOnly ? tr("noFav") : tr("empty");
                const p = document.createElement("p");
                p.textContent = tr("emptyText");
                empty.append(icon, title, p);
                if (!favouritesOnly && !q) {
                  const b = document.createElement("button");
                  b.className = "primary";
                  b.textContent = tr("addFirst");
                  b.onclick = () => openForm();
                  empty.append(b);
                }
                list.append(empty);
                return;
              }

              filtered.forEach(s => {
                const card = document.createElement("article");
                card.className = "card";
                const row = document.createElement("div");
                row.className = "stop";

                const icon = document.createElement("div");
                icon.className = "busicon";
                icon.textContent = "🚏";

                const info = document.createElement("div");
                info.className = "info";
                const name = document.createElement("div");
                name.className = "stopname";
                name.textContent = s.name;
                const sub = document.createElement("div");
                sub.className = "stopid";
                sub.textContent = "№ " + stopNumber(s.url);
                info.append(name, sub);
                info.title = tr("open");

                const actions = document.createElement("div");
                actions.className = "actions";
                const open = document.createElement("button");
                open.className = "small";
                open.textContent = "↗";
                open.title = tr("open");
                open.setAttribute("aria-label", tr("open"));
                open.onclick = () => { location.href = s.url; };

                const fav = document.createElement("button");
                fav.className = "small";
                fav.textContent = s.fav ? "★" : "☆";
                fav.title = tr("favourite");
                fav.setAttribute("aria-label", tr("favourite"));
                fav.onclick = () => {
                  s.fav = !s.fav;
                  persist();
                  render();
                };

                const edit = document.createElement("button");
                edit.className = "small";
                edit.textContent = "✎";
                edit.title = tr("editAction");
                edit.setAttribute("aria-label", tr("editAction"));
                edit.onclick = () => openForm(s.id);

                const del = document.createElement("button");
                del.className = "small danger";
                del.textContent = "×";
                del.title = tr("delete");
                del.setAttribute("aria-label", tr("delete"));
                del.onclick = () => {
                  if (!confirm(tr("confirmDelete"))) return;
                  stops = stops.filter(x => x.id !== s.id);
                  persist();
                  render();
                  notify(tr("deleted"));
                };

                actions.append(open, fav, edit, del);
                row.append(icon, info, actions);
                card.append(row);
                list.append(card);
              });
            }

            function openForm(id = null) {
              editingId = id;
              const s = stops.find(x => x.id === id);
              $("formTitle").textContent = s ? tr("edit") : tr("newStop");
              $("nameLabel").textContent = tr("name");
              $("urlLabel").textContent = tr("url");
              $("urlHint").textContent = tr("urlHint");
              $("favText").textContent = tr("fav");
              $("cancelBtn").textContent = tr("cancel");
              $("saveBtn").textContent = s ? tr("update") : tr("save");
              $("stopName").placeholder = tr("namePlaceholder");
              $("stopUrl").placeholder = tr("urlPlaceholder");
              $("stopName").value = s ? s.name : "";
              $("stopUrl").value = s ? s.url : "";
              $("isFav").checked = s ? !!s.fav : false;
              $("editOverlay").classList.add("open");
              setTimeout(() => $("stopName").focus(), 100);
            }
            function closeForm() {
              $("editOverlay").classList.remove("open");
              editingId = null;
            }

            $("stopForm").addEventListener("submit", e => {
              e.preventDefault();
              const name = $("stopName").value.trim();
              const url = safeUrl($("stopUrl").value);
              if (!name) return notify(tr("invalidName"));
              if (!url) return notify(tr("invalidUrl"));

              const duplicate = stops.some(s => s.url === url && s.id !== editingId);
              if (duplicate) return notify(tr("duplicate"));

              if (editingId) {
                const s = stops.find(x => x.id === editingId);
                if (s) Object.assign(s, {name, url, fav:$("isFav").checked});
                notify(tr("updated"));
              } else {
                stops.push({id:uid(), name, url, fav:$("isFav").checked});
                notify(tr("saved"));
              }
              persist();
              closeForm();
              render();
            });

            $("addBtn").onclick = () => openForm();
            $("cancelBtn").onclick = closeForm;
            $("editOverlay").addEventListener("click", e => {
              if (e.target === $("editOverlay")) closeForm();
            });
            $("search").addEventListener("input", render);
            $("allTab").onclick = () => { favouritesOnly = false; render(); };
            $("favTab").onclick = () => { favouritesOnly = true; render(); };

            function setTheme(value) {
              theme = value === "dark" ? "dark" : "light";
              document.documentElement.dataset.theme = theme;
              try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
              render();
            }
            $("themeBtn").onclick = () => setTheme(theme === "dark" ? "light" : "dark");

            $("langBtn").onclick = () => {
              const order = ["pl","uk","ru","en"];
              lang = order[(order.indexOf(lang) + 1) % order.length];
              try { localStorage.setItem(LANG_KEY, lang); } catch (_) {}
              document.documentElement.lang = lang;
              render();
            };

            function openBackup() {
              $("backupTitle").textContent = tr("backup");
              $("backupHint").textContent = tr("backupHint");
              $("backupNote").textContent = tr("backupNote");
              $("copyBtn").textContent = tr("copy");
              $("closeBackup").textContent = tr("close");
              $("importBtn").textContent = tr("import");
              $("backupText").value = JSON.stringify({
                format:"bus-schedule-lodz",
                version:2,
                stops:stops
              }, null, 2);
              $("backupOverlay").classList.add("open");
            }
            $("backupBtn").onclick = openBackup;
            $("closeBackup").onclick = () => $("backupOverlay").classList.remove("open");
            $("backupOverlay").addEventListener("click", e => {
              if (e.target === $("backupOverlay")) $("backupOverlay").classList.remove("open");
            });
            $("copyBtn").onclick = () => {
              $("backupText").focus();
              $("backupText").select();
              notify(tr("copied"));
            };
            $("importBtn").onclick = () => {
              try {
                const data = JSON.parse($("backupText").value);
                if (!data || !Array.isArray(data.stops) || data.stops.length > 1000) throw Error();
                const restored = data.stops.map(s => {
                  if (!s || typeof s.name !== "string") throw Error();
                  const url = safeUrl(s.url);
                  const name = s.name.trim();
                  if (!name || !url) throw Error();
                  return {
                    id: typeof s.id === "string" ? s.id : uid(),
                    name:name.slice(0,100),
                    url,
                    fav:!!s.fav
                  };
                });
                const unique = [];
                const seen = new Set();
                for (const s of restored) {
                  if (!seen.has(s.url)) {
                    seen.add(s.url);
                    unique.push(s);
                  }
                }
                stops = unique;
                if (!persist()) return;
                $("backupOverlay").classList.remove("open");
                favouritesOnly = false;
                render();
                notify(tr("restored"));
              } catch (_) {
                notify(tr("badBackup"));
              }
            };

            try {
              const saved = load(STORAGE);
              if (saved) {
                const data = JSON.parse(saved);
                if (Array.isArray(data)) {
                  stops = data.map(s => ({
                    id:typeof s.id === "string" ? s.id : uid(),
                    name:String(s.name || "").slice(0,100),
                    url:safeUrl(s.url),
                    fav:!!s.fav
                  })).filter(s => s.name && s.url);
                }
              } else {
                const old = load(OLD_STORAGE);
                if (old) {
                  const data = JSON.parse(old);
                  if (Array.isArray(data)) {
                    stops = data.map(s => ({
                      id:uid(),
                      name:String(s.name || "").slice(0,100),
                      url:safeUrl(s.url),
                      fav:false
                    })).filter(s => s.name && s.url);
                  }
                }
              }
            } catch (_) { stops = []; }

            const savedLang = load(LANG_KEY);
            const deviceLang = (navigator.language || "pl").slice(0,2).toLowerCase();
            lang = dict[savedLang] ? savedLang : (dict[deviceLang] ? deviceLang : "pl");
            const savedTheme = load(THEME_KEY);
            theme = savedTheme === "dark" || savedTheme === "light"
              ? savedTheme
              : ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
            document.documentElement.dataset.theme = theme;
            document.documentElement.lang = lang;
            persist();
            render();
          })();
          </script>
          </body>
          </html>
          EOF

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/Bus-Schedule-Lodz.apk
          sha256sum release/Bus-Schedule-Lodz.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bus-Schedule-Lodz-APK
          path: release/Bus-Schedule-Lodz.apk
          if-no-files-found: error
          retention-days: 14
