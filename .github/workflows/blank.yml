name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/dmytryku/busschedule app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BusSchedule"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dmytryku.busschedule'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.dmytryku.busschedule'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/res/values app/src/main/res/values-ru app/src/main/res/values-uk app/src/main/res/values-pl

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Buses</string>
          </resources>
          EOF

          cat > app/src/main/res/values-ru/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Автобусы</string>
          </resources>
          EOF

          cat > app/src/main/res/values-uk/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Автобуси</string>
          </resources>
          EOF

          cat > app/src/main/res/values-pl/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Autobusy</string>
          </resources>
          EOF

          cat > app/src/main/java/com/dmytryku/busschedule/MainActivity.java <<'EOF'
          package com.dmytryku.busschedule;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
          s.setUseWideViewPort(true);
          s.setLoadWithOverviewMode(true);
          s.setTextZoom(100);
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          String sch = u.getScheme();
                          if ("http".equals(sch) || "https".equals(sch) || "file".equals(sch)) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="uk">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Bus timetable</title>
          <style>
          :root{--bg:#f4f6fa;--card:#fff;--text:#161a20;--muted:#8a93a1;--accent:#1a73e8;--line:#e4e7ec;--chip:#e8f0fe;--fab1:#3d8bff;--fab2:#1a56db;--glow:rgba(26,115,232,.45);color-scheme:light}
          :root[data-theme="dark"]{--bg:#111316;--card:#1b1f25;--text:#ffffff;--muted:#7f8896;--accent:#7ab0ff;--line:#2a2f37;--chip:#232b38;--fab1:#7fb4ff;--fab2:#3f74e6;--glow:rgba(90,150,255,.4);color-scheme:dark}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif}
          main{max-width:560px;margin:0 auto;padding:16px 16px 110px}
          header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 18px}
          h1{font-size:23px;font-weight:800;letter-spacing:-.2px;margin:0}
          button{font:inherit;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
          .card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}
          .enter{animation:rise .35s ease both}
          @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
          @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
          .stop{display:flex;align-items:center;gap:6px;padding:12px 8px 12px 12px;transition:transform .12s ease,background .12s ease}
          .stop:active{transform:scale(.975);background:var(--chip)}
          .main{flex:1;min-width:0;display:flex;align-items:center;gap:13px;text-decoration:none;color:var(--text)}
          .bi{flex:none;width:46px;height:46px;border-radius:14px;background:var(--chip);color:var(--accent);display:flex;align-items:center;justify-content:center}
          .tx{min-width:0;display:block}
          .nm{display:block;font-weight:800;font-size:18px;line-height:1.25;word-break:break-word}
          .sub{display:block;margin-top:3px;color:var(--muted);font-size:12.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .more{flex:none;width:42px;height:42px;padding:0;border-radius:50%;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
          .more:active{background:var(--line)}
          #theme{flex:none;width:44px;height:44px;padding:0;border-radius:50%;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s}
          #theme:active{background:var(--line);transform:rotate(25deg) scale(.92)}
          .empty{text-align:center;padding:36px 12px 0;color:var(--muted)}
          .empty svg{display:block;margin:0 auto 14px}
          .empty b{display:block;color:var(--text);font-size:19px;font-weight:800;margin-bottom:6px}
          .empty p{margin:0 auto 20px;max-width:300px;font-size:15px}
          .primary{background:var(--accent);color:#fff;font-weight:700}
          .secondary{background:transparent;color:var(--muted)}
          .cta{padding:13px 22px;border-radius:14px}
          .fab{position:fixed;right:20px;bottom:24px;width:62px;height:62px;border-radius:50%;padding:0;background:linear-gradient(135deg,var(--fab1),var(--fab2));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px var(--glow),0 2px 6px rgba(0,0,0,.28);transition:transform .15s ease,box-shadow .15s ease}
          .fab:active{transform:scale(.9) rotate(90deg);box-shadow:0 3px 10px var(--glow)}
          input{width:100%;padding:13px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-size:16px}
          .ov{display:none;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px;z-index:10}
          .ov.open{display:flex}
          .ov.open .dlg{animation:pop .18s ease}
          .dlg{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:420px}
          .dlg h2{margin:0 0 14px;font-size:20px;font-weight:800}
          .row{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
          .menu{display:none;position:fixed;z-index:20;min-width:176px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
          .menu.open{display:block;animation:pop .13s ease}
          .menu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:10px;background:transparent;color:var(--text);font-size:15px;text-align:left}
          .menu button:active{background:var(--chip)}
          .menu .mdel{color:var(--muted)}
          @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
          </style>
          </head>
          <body>
          <main>
            <header>
              <h1 id="h1"></h1>
              <button id="theme"></button>
            </header>
            <div id="list"></div>
          </main>
          <button class="fab" id="add"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <div class="menu" id="menu">
            <button id="mEdit"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></svg><span id="tEdit"></span></button>
            <button id="mDel" class="mdel"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span id="tDel"></span></button>
          </div>
          <div class="ov" id="ov">
            <div class="dlg">
              <h2 id="ttl"></h2>
              <input id="name" autocomplete="off">
              <input id="url" type="url" autocomplete="off">
              <div class="row">
                <button class="secondary" id="cancel"></button>
                <button class="primary" id="save"></button>
              </div>
            </div>
          </div>
          <script>
          var L={
            ru:{title:"Расписание автобусов",emptyT:"Добавьте первую остановку",emptyP:"Сохраните ссылку на расписание, чтобы открывать его в одно касание.",addFirst:"Добавить остановку",newStop:"Новая остановка",editStop:"Изменить остановку",name:"Название остановки",url:"Вставьте ссылку на расписание",cancel:"Отмена",save:"Сохранить",edit:"Изменить",remove:"Удалить",del:"Удалить «%s»?",theme:"Сменить тему"},
            uk:{title:"Розклад автобусів",emptyT:"Додайте першу зупинку",emptyP:"Збережіть посилання на розклад, щоб відкривати його одним дотиком.",addFirst:"Додати зупинку",newStop:"Нова зупинка",editStop:"Змінити зупинку",name:"Назва зупинки",url:"Вставте посилання на розклад",cancel:"Скасувати",save:"Зберегти",edit:"Змінити",remove:"Видалити",del:"Видалити «%s»?",theme:"Змінити тему"},
            pl:{title:"Rozkład autobusów",emptyT:"Dodaj pierwszy przystanek",emptyP:"Zapisz link do rozkładu, aby otwierać go jednym dotknięciem.",addFirst:"Dodaj przystanek",newStop:"Nowy przystanek",editStop:"Edytuj przystanek",name:"Nazwa przystanku",url:"Wklej link do rozkładu",cancel:"Anuluj",save:"Zapisz",edit:"Edytuj",remove:"Usuń",del:"Usunąć „%s”?",theme:"Zmień motyw"},
            en:{title:"Bus timetable",emptyT:"Add your first stop",emptyP:"Save a timetable link to open it with a single tap.",addFirst:"Add a stop",newStop:"New stop",editStop:"Edit stop",name:"Stop name",url:"Paste the timetable link",cancel:"Cancel",save:"Save",edit:"Edit",remove:"Delete",del:"Delete “%s”?",theme:"Switch theme"}
          };
          var lang=((navigator.language||"en")+"").slice(0,2).toLowerCase();
          var T=L[lang]||L.en;
          document.documentElement.lang=L[lang]?lang:"en";
          document.title=T.title;
          function $(id){return document.getElementById(id)}
          $("h1").textContent=T.title;
          $("name").placeholder=T.name;
          $("url").placeholder=T.url;
          $("cancel").textContent=T.cancel;
          $("save").textContent=T.save;
          $("tEdit").textContent=T.edit;
          $("tDel").textContent=T.remove;
          $("theme").setAttribute("aria-label",T.theme);
          $("add").setAttribute("aria-label",T.newStop);

          var SVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">';
          var SUN=SVG+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
          var MOON=SVG+'<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8z"/></svg>';
          var BUS='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M7 17v3M17 17v3"/><circle cx="8" cy="14" r=".7"/><circle cx="16" cy="14" r=".7"/></svg>';
          var DOTS='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>';
          var ART='<svg viewBox="0 0 160 140" width="150" height="131" aria-hidden="true"><ellipse cx="80" cy="130" rx="52" ry="6" style="fill:var(--line)"/><rect x="60" y="8" width="40" height="13" rx="6" style="fill:var(--accent)"/><rect x="30" y="20" width="100" height="94" rx="22" style="fill:var(--card);stroke:var(--accent);stroke-width:4"/><rect x="43" y="35" width="74" height="42" rx="11" style="fill:var(--chip)"/><path d="M60 77l13-42h9L69 77z" style="fill:var(--accent);opacity:.2"/><rect x="34" y="86" width="92" height="6" style="fill:var(--accent)"/><circle cx="51" cy="101" r="6" style="fill:var(--accent)"/><circle cx="109" cy="101" r="6" style="fill:var(--accent)"/><rect x="46" y="112" width="20" height="14" rx="5" style="fill:var(--accent)"/><rect x="94" y="112" width="20" height="14" rx="5" style="fill:var(--accent)"/></svg>';

          var KEY="bus-stops",stops=[],editing=-1,isOpen=false,menuIdx=-1,first=true;
          function applyTheme(t){
            document.documentElement.setAttribute("data-theme",t);
            $("theme").innerHTML=(t==="dark")?SUN:MOON;
          }
          var theme=null;
          try{theme=localStorage.getItem("theme")}catch(e){}
          if(theme!=="dark"&&theme!=="light"){
            theme=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
          }
          applyTheme(theme);
          $("theme").onclick=function(){
            theme=(theme==="dark")?"light":"dark";
            applyTheme(theme);
            try{localStorage.setItem("theme",theme)}catch(e){}
          };
          function load(){try{stops=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){stops=[]}}
          function store(){try{localStorage.setItem(KEY,JSON.stringify(stops))}catch(e){}}
          function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
          function hostOf(u){try{return new URL(u).host}catch(e){return u}}
          function render(){
            var l=$("list");
            if(!stops.length){
              l.innerHTML='<div class="empty">'+ART+'<b>'+T.emptyT+'</b><p>'+T.emptyP+'</p><button class="primary cta" onclick="openDlg()">+ '+T.addFirst+'</button></div>';
              first=false;return
            }
            l.innerHTML=stops.map(function(s,i){
              var cls="card stop"+(first?" enter":"");
              var delay=first?' style="animation-delay:'+(i*45)+'ms"':'';
              return '<div class="'+cls+'"'+delay+'><a class="main" href="'+esc(s.url)+'" target="_blank"><span class="bi">'+BUS+'</span><span class="tx"><span class="nm">'+esc(s.name)+'</span><span class="sub">'+esc(hostOf(s.url))+'</span></span></a>'+
              '<button class="more" onclick="showMenu(event,'+i+')">'+DOTS+'</button></div>'
            }).join("");
            first=false
          }
          function hideMenu(){$("menu").className="menu"}
          function showMenu(ev,i){
            ev.stopPropagation();
            var m=$("menu");
            if(m.className.indexOf("open")>=0&&menuIdx===i){hideMenu();return}
            menuIdx=i;
            var r=ev.currentTarget.getBoundingClientRect();
            m.className="menu open";
            var h=m.offsetHeight,top=r.bottom+4;
            if(top+h>window.innerHeight-8)top=Math.max(8,r.top-h-4);
            m.style.top=top+"px";m.style.left="auto";
            m.style.right=Math.max(8,window.innerWidth-r.right)+"px"
          }
          document.addEventListener("click",hideMenu);
          window.addEventListener("scroll",hideMenu,{passive:true});
          $("mEdit").onclick=function(){var i=menuIdx;hideMenu();openDlg(i)};
          $("mDel").onclick=function(){var i=menuIdx;hideMenu();del(i)};
          function fixUrl(u){u=u.trim();if(u&&!/^https?:\/\//i.test(u))u="https://"+u;return u}
          function openDlg(i){
            editing=(typeof i==="number")?i:-1;
            $("ttl").textContent=editing>=0?T.editStop:T.newStop;
            $("name").value=editing>=0?stops[editing].name:"";
            $("url").value=editing>=0?stops[editing].url:"";
            $("ov").className="ov open";
            if(!isOpen){isOpen=true;try{history.pushState({d:1},"")}catch(e){}}
            setTimeout(function(){$("name").focus()},50)
          }
          function hideDlg(){isOpen=false;$("ov").className="ov"}
          function closeDlg(){if(isOpen){try{history.back()}catch(e){hideDlg()}}}
          window.addEventListener("popstate",hideDlg);
          $("add").onclick=function(){openDlg()};
          $("cancel").onclick=closeDlg;
          $("ov").onclick=function(e){if(e.target===this)closeDlg()};
          $("save").onclick=function(){
            var n=$("name").value.trim(),u=fixUrl($("url").value);
            if(!n||!u)return;
            if(editing>=0){stops[editing]={name:n,url:u}}else stops.push({name:n,url:u});
            store();render();closeDlg()
          };
          function del(i){if(confirm(T.del.replace("%s",stops[i].name))){stops.splice(i,1);store();render()}}
          load();render();
          </script>
          </body>
          </html>
          EOF

          if [ -f icon.png ]; then
            mkdir -p app/src/main/res/mipmap-xxhdpi
            cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            sed -i 's|<application|<application android:icon="@mipmap/ic_launcher"|' app/src/main/AndroidManifest.xml
          fi
      - name: Build APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk bus-schedule.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bus-schedule-apk
          path: bus-schedule.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Автобусы v${{ github.run_number }}
          files: bus-schedule.apk
